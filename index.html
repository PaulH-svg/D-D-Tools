<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Table du MJ</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">⬡ <span>LA TABLE DU MJ<small>D&D · 5e édition · 2014</small></span></div><nav><button data-view="combat">⚔ Combat</button><button data-view="library">▤ Fiches</button></nav><button id="export">Exporter</button><label class="button">Importer<input type="file" id="import" accept="application/json" hidden></label></header>
<main><div class="heading"><div><p class="eyebrow">VOTRE ÉCRAN DE MAÎTRE DU JEU</p><h1 id="title">Le combat, à votre rythme.</h1><p id="subtitle">Préparez la rencontre. Gardez le fil de l’aventure.</p></div><button class="primary" id="new-sheet">+ Créer une fiche</button></div><div id="notice" role="status"></div><section id="content"></section></main>
<dialog id="editor"><form id="sheet-form"><div class="dialog-head"><h2>Fiche de personnage ou créature</h2><button type="button" id="close-editor">✕</button></div><input name="id" type="hidden"><div class="form-grid"><label>Nom<input name="name" required maxlength="100"></label><label>Type<select name="kind"><option>Créature</option><option>PJ</option></select></label><label>PV maximum<input name="maxHp" type="number" min="1" max="99999" required value="10"></label><label>Classe d’armure<input name="ac" type="number" min="0" max="99" value="10" required></label><label>Vitesse<input name="speed" value="9 m"></label></div><div class="stats-input" id="stats-input"></div><label>Compétences et sauvegardes<textarea name="skills" rows="2"></textarea></label><label>Attaques et sorts — bonus, dégâts, portée, durée, effets<textarea name="actions" rows="5" placeholder="Une action ou un sort par paragraphe"></textarea></label><label>Traits, résistances et autres notes<textarea name="traits" rows="3"></textarea></label><button class="primary" type="submit">Enregistrer la fiche</button></form></dialog><script type="module" src="app.js"></script></body></html>
